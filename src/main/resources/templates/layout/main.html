<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content, pageScripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">2253 Apparel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button" aria-label="Toggle navigation">
                    <i class="fas fa-bars"></i>
                </a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <span class="nav-link font-weight-bold">Ecomm Inventory Movement</span>
            </li>
        </ul>

        <ul class="navbar-nav ml-auto">
            <li class="nav-item dropdown">
                <a class="nav-link" data-toggle="dropdown" href="#" aria-label="Open profile menu">
                    <i class="far fa-circle-user mr-1"></i><span class="d-none d-sm-inline">Account</span>
                </a>
                <div class="dropdown-menu dropdown-menu-right">
                    <a href="#" class="dropdown-item"><i class="far fa-user mr-2 text-muted"></i>Profile</a>
                    <a href="#" class="dropdown-item"><i class="fas fa-gear mr-2 text-muted"></i>Settings</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item"><i class="fas fa-arrow-right-from-bracket mr-2 text-muted"></i>Logout</a>
                </div>
            </li>
        </ul>
    </nav>

    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/dashboard}" class="brand-link">
            <span class="brand-image sidebar-brand-icon"><i class="fa-solid fa-layer-group"></i></span>
            <span class="brand-text font-weight-light">2253 <strong>APPAREL</strong></span>
        </a>
        <div class="sidebar">
            <nav class="mt-3" aria-label="Main navigation">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="true">
                    <li class="nav-header">MAIN MENU</li>
                    <li class="nav-item">
                        <a th:href="@{/plm-styles-integration}" class="nav-link">
                            <i class="nav-icon fa-solid fa-shirt"></i>
                            <p>PLM Styles Integration </p>
                        </a>
                    </li>
                    <li class="nav-item menu-open">
                        <a th:href="@{/inventory-movement}" class="nav-link">
                            <i class="nav-icon fa-solid fa-list"></i>
                            <p>Ecomm Inventory Movement</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="nav-icon fa-solid fa-chart-column"></i>
                            <p>Reporting  <i class="right fas fa-angle-left"></i></p>
                        </a>
                        <ul class="nav nav-treeview">
                            <li class="nav-item">
                                <a href="#" class="nav-link active">
                                    <i class="fa-solid fa-chart-simple nav-icon"></i>
                                    <p>ATS Report</p>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="nav-icon fa-solid fa-sync-alt"></i>
                            <p>Batch Jobs  <i class="right fas fa-angle-left"></i></p>
                        </a>
                        <ul class="nav nav-treeview">
                            <li class="nav-item">
                                <a th:href="@{/job-inventory-adjustment}" class="nav-link active">
                                    <i class="fa-solid fa-box-open nav-icon"></i>
                                    <p>Inventory Adjustment</p>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <span class="status-indicator"></span>
                <span>Active Status</span>
            </div>
        </div>
    </aside>

    <th:block th:replace="${content}"></th:block>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<th:block th:replace="${pageScripts}"></th:block>
</body>
</html>
